name: Build VPN1S Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache-dependency-path: core/go.sum

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          add-to-path: true
          link-to-sdk: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Android config
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
            echo "ndk.dir=${{ steps.ndk.outputs.ndk-path }}"
          } > local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Create default env
        run: |
          echo '{"APP_ENV":"stable"}' > env.json

      - name: Build APK (Split ABI & Universal)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          # Build split ABIs (arm64-v8a, armeabi-v7a, x86_64)
          flutter build apk --release --split-per-abi -v
          # Build universal APK
          flutter build apk --release -v

      - name: Organize APK Artifacts
        run: |
          mkdir -p output-apk
          cp build/app/outputs/flutter-apk/*.apk output-apk/
          ls -la output-apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VPN1S-Android-Release-APKs
          path: output-apk/*.apk
          if-no-files-found: error

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
