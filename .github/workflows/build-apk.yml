name: Build VPN1S Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
          cache-dependency-path: core/go.sum

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle wrapper
        run: |
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." android/
          chmod +x android/gradlew

      - name: Prepare Android config
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          {
            echo "flutter.sdk=$FLUTTER_ROOT"
            echo "sdk.dir=$ANDROID_HOME"
            echo "ndk.dir=${{ steps.ndk.outputs.ndk-path }}"
          } > local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build VPN1S APKs
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          dart setup.dart android --env stable -v

      - name: Collect APK Files
        run: |
          mkdir -p output-apk
          # Copy only arm64-v8a APK (smallest, most common architecture)
          find dist/ -name "*arm64*release*.apk" -exec cp {} output-apk/ \; 2>/dev/null || true
          find build/ -name "*arm64*release*.apk" -exec cp {} output-apk/ \; 2>/dev/null || true
          # Fallback: if no arm64 found, copy all APKs
          if [ -z "$(ls output-apk/*.apk 2>/dev/null)" ]; then
            find dist/ -name "*.apk" -exec cp {} output-apk/ \; 2>/dev/null || true
            find build/ -name "*.apk" -exec cp {} output-apk/ \; 2>/dev/null || true
          fi
          ls -la output-apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VPN1S-arm64-v8a-Release
          path: output-apk/*.apk
          if-no-files-found: error

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
